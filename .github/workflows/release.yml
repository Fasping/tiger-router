name: Release

# Publishes to npm through OIDC when you push a tag like v3.0.1.
# npm trusts this exact GitHub repository and workflow; no long-lived token is used.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run verify

      - name: Publish
        run: npm publish --access public
